  <style>
    :root { --ink:#1e1e1e; --muted-ink:#161616; --coral:#ee785a; --coral-dark:#e96e4f; --green:#1f3327; --paper:#f5f2ec; --design-width:1200; --design-height:700; --art-scale:1; }
    *,*::before,*::after{box-sizing:border-box} html,body{width:100%;min-height:100%;margin:0} body{overflow-x:hidden;overflow-y:auto;background:var(--paper);color:var(--ink);font-family:Inter,Arial,sans-serif} button,a{font:inherit}button{border:0}
    .screen{position:relative;width:100%;height:max(100dvh,calc(var(--design-height)*1px*var(--art-scale)));min-height:560px;overflow:hidden;isolation:isolate;background:linear-gradient(109deg,#f5f2ec 0%,#eaf0d5 50%,#e0edc7 100%)}
    .video-layer,.video-layer video,.gaze-canvas,.video-tint{position:absolute;inset:0;width:100%;height:100%}.video-layer{z-index:0;overflow:hidden;background:var(--paper)}.video-layer video{display:block;object-fit:cover;object-position:center;filter:saturate(.98) contrast(.99);opacity:.001}.gaze-canvas{z-index:1;display:block;pointer-events:none}.video-tint{z-index:2;pointer-events:none;background:linear-gradient(109deg,rgba(245,242,236,.16) 0%,rgba(234,240,213,.06) 50%,rgba(224,237,199,.02) 100%)}
    .content{position:absolute;z-index:3;width:calc(var(--design-width)*1px);height:calc(var(--design-height)*1px);top:50%;left:50%;transform:translate(-50%,-50%) scale(var(--art-scale));transform-origin:center;pointer-events:none}
    .nav{position:absolute;top:20px;left:0;display:flex;width:100%;height:54px;align-items:center;justify-content:space-between;padding:10px 40px;pointer-events:auto}.logo{color:var(--ink);font-size:14px;font-weight:700;line-height:normal}.nav-right,.nav-links{display:flex;align-items:center}.nav-right{justify-content:flex-end;gap:42px}.nav-links{gap:42px}.nav-links a{color:var(--ink);font-size:14px;line-height:normal;text-decoration:none;white-space:nowrap;transition:opacity .2s ease}.nav-links a:hover,.nav-links a:focus-visible{opacity:.6}
    .btn-main{display:flex;width:154px;height:34px;align-items:stretch;padding:0;border:0;background:transparent;appearance:none;cursor:pointer;filter:drop-shadow(0 2px 8px rgba(31,51,39,.08))}.btn-main:focus-visible{outline:2px solid rgba(31,51,39,.75);outline-offset:3px}.btn-main .label{display:inline-flex;width:78%;height:100%;align-items:center;justify-content:center;padding:12px 24px;border-radius:240px;background:var(--coral);color:#fff;font-size:14px;line-height:12.6px;white-space:nowrap}.btn-main .icon{display:grid;width:22%;height:100%;place-items:center;margin-left:-1px;border-radius:68px;background:var(--coral);color:#fff;font-size:18px;line-height:1;transition:transform .2s ease}.btn-main:hover .icon,.btn-main:focus-visible .icon{transform:translate(2px,-1px)}
    .hero-title{position:absolute;top:105px;left:40px;width:360px;margin:0;color:var(--coral);font-family:"Inter Tight","Arial Narrow",Inter,Arial,sans-serif;font-size:64px;font-weight:500;letter-spacing:0;line-height:normal}.hero-subtitle{position:absolute;top:194px;left:40px;width:355px;margin:0;color:var(--muted-ink);font-size:16px;font-weight:400;letter-spacing:0;line-height:22.4px}
    .card{position:absolute;top:487px;left:895px;display:flex;width:265px;height:173px;flex-direction:column;align-items:flex-start;padding:20px;border-radius:16px;background:var(--green);color:#fff;pointer-events:auto}.card-kicker{width:fit-content;margin-top:-1px;color:rgba(255,255,255,.8);font-size:10px;line-height:normal;white-space:nowrap}.card h2{align-self:stretch;margin:17px 0 20px;color:#fff;font-size:16px;font-weight:400;line-height:22.4px}.card button{display:flex;width:172px;height:41px;align-items:center;justify-content:center;padding:12px 24px;border-radius:240px;background:var(--coral-dark);color:#fff;font-size:14px;line-height:normal;cursor:pointer;transition:transform .2s ease,background-color .2s ease}.card button:hover,.card button:focus-visible{transform:translateY(-2px);background:#ee785a}
    .polaroid{position:absolute;display:block;height:auto;z-index:4;pointer-events:none;user-select:none}.polaroid-left{top:359px;left:16px;width:273px}.polaroid-right{top:117px;left:887px;width:276px}:focus-visible{outline:2px solid rgba(31,51,39,.8);outline-offset:4px}
    @media (min-aspect-ratio:2/1) and (min-width:1200px){.content{margin-left:clamp(0px,2vw,72px)}}
    @media (max-width:900px){.screen{min-height:0}.content{width:100%;height:100%;transform:none;top:0;left:0}.nav{top:max(12px,env(safe-area-inset-top));height:50px;padding:8px 18px}.nav-links{display:none}.nav-right{gap:0}.btn-main{width:132px;height:36px}.btn-main .label{font-size:12px}.hero-title{top:104px;left:20px;width:calc(100% - 40px);font-size:clamp(46px,14vw,64px)}.hero-subtitle{top:180px;left:20px;width:min(290px,calc(100% - 40px));font-size:14px;line-height:20px}.card{top:auto;right:20px;bottom:max(20px,env(safe-area-inset-bottom));left:20px;width:auto;height:auto;min-height:154px;padding:18px}.card h2{margin:12px 0 16px;font-size:15px;line-height:20px}.card button{width:100%;height:44px}.polaroid-left{top:auto;right:auto;bottom:170px;left:-8px;width:min(42vw,190px)}.polaroid-right{top:238px;right:-10px;left:auto;width:min(42vw,190px)}}
    @media (max-width:380px){.hero-title{top:88px}.hero-subtitle{top:157px}.polaroid-right{top:215px}.card{bottom:14px}}
    @media (prefers-reduced-motion:reduce){.btn-main .icon,.card button{transition:none}}
  </style>
</head>
<body>
  <main class="screen" id="screen">
    <div class="video-layer" aria-hidden="true"><video id="lookVideo" src="look.mp4" poster="frames/frame-001.webp" preload="metadata" muted playsinline></video></div>
    <canvas class="gaze-canvas" id="gazeCanvas" aria-hidden="true"></canvas><div class="video-tint" aria-hidden="true"></div>
    <div class="content">
      <nav class="nav" aria-label="Основная навигация"><div class="logo">Logo</div><div class="nav-right"><div class="nav-links"><a href="#about">О нас</a><a href="#benefits">Преимущества</a><a href="#price">Стоимость</a><a href="#contacts">Контакты</a></div><button class="btn-main" type="button" aria-label="Связаться"><span class="label">Связаться</span><span class="icon" aria-hidden="true">↗</span></button></div></nav>
      <h1 class="hero-title">Зверополис</h1><p class="hero-subtitle">Ветеринарная помощь в Жуковском и Московской области</p>
      <aside class="card" id="price"><div class="card-kicker">ВАКЦИНАЦИЯ</div><h2>Забота о здоровье питомца по доступной цене</h2><button type="button">Узнать стоимость</button></aside>
      <img class="polaroid polaroid-left" src="assets/polaroid-puppy.png" alt="" aria-hidden="true" /><img class="polaroid polaroid-right" src="assets/polaroid-vet-cat.png" alt="" aria-hidden="true" />
    </div>
  </main>
  <script>
    (() => {
      const screen=document.getElementById('screen'),canvas=document.getElementById('gazeCanvas'),context=canvas.getContext('2d',{alpha:false,desynchronized:true});
      const DESIGN_WIDTH=1200,DESIGN_HEIGHT=700,SOURCE_WIDTH=1280,SOURCE_HEIGHT=720,FRAME_COUNT=193,MAX_CACHE=12;
      // Real anchors measured from the supplied 193-frame, 24 FPS source.
      const KEY_FRAMES=Object.freeze({center:3,left:24,upLeft:52,up:71,upRight:97,right:145,downRight:158,down:171,downLeft:177,centerReturn:186});
      const clamp=(value,min,max)=>Math.max(min,Math.min(max,value)),frameUrl=frame=>`frames/frame-${String(clamp(Math.round(frame),1,FRAME_COUNT)).padStart(3,'0')}.webp`;
      const cache=new Map(),pendingLoads=new Map();
      function remember(frame,image){cache.delete(frame);cache.set(frame,image);while(cache.size>MAX_CACHE)cache.delete(cache.keys().next().value)}
      function loadFrame(frame){const index=clamp(Math.round(frame),1,FRAME_COUNT);if(cache.has(index)){const image=cache.get(index);remember(index,image);return Promise.resolve(image)}if(pendingLoads.has(index))return pendingLoads.get(index);const promise=new Promise((resolve,reject)=>{const image=new Image();image.decoding='async';image.onload=async()=>{try{if(image.decode)await image.decode()}catch(_){/* drawImage will decode */}remember(index,image);pendingLoads.delete(index);resolve(image)};image.onerror=()=>{pendingLoads.delete(index);reject(new Error(`Unable to load ${frameUrl(index)}`))};image.src=frameUrl(index)});pendingLoads.set(index,promise);return promise}
      const preload=frame=>loadFrame(frame).catch(()=>{});[3,24,52,71,97,145,158,171,177,186].forEach(preload);
      let viewportWidth=0,viewportHeight=0,sourceScale=1,sourceOffsetX=0,sourceOffsetY=0,pointerX=0,pointerY=0,pointerClientX=0,pointerClientY=0,pointerInside=false,smoothX=0,smoothY=0,direction='center',pendingDirection='center',pendingSince=0,framePosition=KEY_FRAMES.center,frameTarget=KEY_FRAMES.center,frameVelocity=0,lastFrame=Math.round(framePosition),lastTime=performance.now();
      function resize(){const rect=screen.getBoundingClientRect(),artScale=rect.width<=900?1:rect.width/DESIGN_WIDTH;screen.style.setProperty('--art-scale',Math.max(.58,artScale).toFixed(4));viewportWidth=rect.width;viewportHeight=screen.clientHeight;const dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(viewportWidth*dpr);canvas.height=Math.round(viewportHeight*dpr);canvas.style.width=`${viewportWidth}px`;canvas.style.height=`${viewportHeight}px`;context.setTransform(dpr,0,0,dpr,0,0);sourceScale=Math.max(viewportWidth/SOURCE_WIDTH,viewportHeight/SOURCE_HEIGHT);sourceOffsetX=(viewportWidth-SOURCE_WIDTH*sourceScale)/2;sourceOffsetY=(viewportHeight-SOURCE_HEIGHT*sourceScale)/2}
      function characterPoint(){return{x:sourceOffsetX+640*sourceScale,y:sourceOffsetY+428*sourceScale}}
      function setPointer(event){const rect=screen.getBoundingClientRect(),point=characterPoint(),localX=event.clientX-rect.left,localY=event.clientY-rect.top;pointerClientX=localX;pointerClientY=localY;pointerX=clamp((localX-point.x)/Math.max(150,viewportWidth*.42),-1,1);pointerY=clamp((localY-point.y)/Math.max(140,viewportHeight*.42),-1,1);pointerInside=true}
      function resetPointer(){pointerX=0;pointerY=0;pointerInside=false}
      function isDownZone(){const point=characterPoint(),horizontalRadius=clamp(132*sourceScale,42,165);return pointerInside&&pointerY>.28&&pointerClientY>viewportHeight*.80&&Math.abs(pointerClientX-point.x)<horizontalRadius}
      function chooseGaze(x,y){if(Math.hypot(x,y)<.115)return'center';if(isDownZone())return'down';if(y>.10&&Math.abs(x)<.32)return'center';const angle=Math.atan2(y,x)*180/Math.PI;if(angle>=-22.5&&angle<22.5)return'right';if(angle>=22.5&&angle<67.5)return'downRight';if(angle>=67.5&&angle<112.5)return'center';if(angle>=112.5&&angle<157.5)return'downLeft';if(angle>=157.5||angle< -157.5)return'left';if(angle>=-157.5&&angle< -112.5)return'upLeft';if(angle>=-112.5&&angle< -67.5)return'up';return'upRight'}
      function updatePointer(now,dt){const smoothing=1-Math.exp(-dt/.075);smoothX+=(pointerX-smoothX)*smoothing;smoothY+=(pointerY-smoothY)*smoothing;const candidate=chooseGaze(smoothX,smoothY);if(candidate===direction){pendingDirection=candidate;pendingSince=now;return}if(candidate!==pendingDirection){pendingDirection=candidate;pendingSince=now;return}const dwell=candidate==='center'?85:48;if(now-pendingSince>=dwell){direction=candidate;frameTarget=KEY_FRAMES[direction]??KEY_FRAMES.center;screen.dataset.gaze=direction}}
      function drawFrame(frame){const index=clamp(Math.round(frame),1,FRAME_COUNT),image=cache.get(index);if(!image){preload(index);return}remember(index,image);context.clearRect(0,0,viewportWidth,viewportHeight);context.drawImage(image,sourceOffsetX,sourceOffsetY,SOURCE_WIDTH*sourceScale,SOURCE_HEIGHT*sourceScale)}
      function prefetchAround(frame){const base=Math.round(frame);for(let offset=-3;offset<=3;offset+=1)preload(base+offset)}
      function animate(now){const dt=Math.min(.05,Math.max(.001,(now-lastTime)/1000));lastTime=now;updatePointer(now,dt);const spring=42,damping=13,acceleration=(frameTarget-framePosition)*spring-frameVelocity*damping;frameVelocity+=acceleration*dt;framePosition=clamp(framePosition+frameVelocity*dt,1,FRAME_COUNT);const nearest=Math.round(framePosition);if(nearest!==lastFrame){lastFrame=nearest;drawFrame(nearest);prefetchAround(framePosition)}requestAnimationFrame(animate)}
      screen.addEventListener('pointermove',setPointer,{passive:true});screen.addEventListener('pointerleave',resetPointer,{passive:true});window.addEventListener('blur',resetPointer,{passive:true});window.addEventListener('resize',resize,{passive:true});resize();loadFrame(KEY_FRAMES.center).then(()=>drawFrame(framePosition)).catch(()=>{});requestAnimationFrame(animate);
    })();
  </script>
</body>
